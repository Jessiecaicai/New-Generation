server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agent_meta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:pp0123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 600000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举按 name() 写入/读取（匹配 MySQL ENUM/VARCHAR）
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      # 主键默认不自增（实体里按需用 @TableId(type = IdType.INPUT/AUTO) 覆盖）
      id-type: INPUT

agent:
  service:
    url: ${AGENT_SERVICE_URL:http://localhost:8001}
    timeout: 60000

  paths:
    data-root: ${AGENT_DATA_ROOT:./data}

  business-datasource:
    url: ${BUSINESS_DATASOURCE_URL:jdbc:mysql://localhost:3306/business_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:pp0123456}

logging:
  level:
    com.newgen.agent: INFO
  file:
    path: ${AGENT_LOG_DIR:./data/logs/java}
